# https://taskfile.dev
# Run with `task <name>` in the Nix devshell, or `go tool task <name>` without Nix.
version: "3"

vars:
  GOLANGCI_LINT_VERSION: 2.15.0
  VERSION_PKG: github.com/gauthier-se/verve/internal/version

tasks:
  default:
    cmds:
      - "{{.TASK_EXE}} --list"
    silent: true

  lint:
    desc: Run all linters and format checks (Go and web)
    cmds:
      - task: go:lint
      - task: web:lint

  go:lint:
    desc: Run the Go linters and format checks
    deps: [lint:check-version]
    cmds:
      - golangci-lint run ./...

  lint:check-version:
    internal: true
    silent: true
    cmds:
      - |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not found: enter the Nix devshell (direnv allow, or nix develop) or install v{{.GOLANGCI_LINT_VERSION}}" >&2
          exit 1
        fi
        if ! golangci-lint version | grep -q "has version {{.GOLANGCI_LINT_VERSION}} "; then
          echo "golangci-lint v{{.GOLANGCI_LINT_VERSION}} is required, found: $(golangci-lint version)" >&2
          exit 1
        fi

  fmt:
    desc: Format the Go code
    deps: [lint:check-version]
    cmds:
      - golangci-lint fmt ./...

  test:
    desc: Run all tests (Go and web)
    cmds:
      - task: go:test
      - task: web:test

  go:test:
    desc: Run the Go tests with the race detector
    cmds:
      - go test -race ./...

  test:coverage:
    desc: Run the Go tests with coverage and enforce the floor from .testcoverage.yml
    cmds:
      - go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - go tool go-test-coverage --config=.testcoverage.yml

  test:coverage-summary:
    desc: Print the per-package coverage of coverage.out as a Markdown table
    silent: true
    cmds:
      # -coverpkg repeats each block once per test binary: a block counts as
      # covered if any test binary executed it.
      - |
        echo "| Package | Coverage |"
        echo "|---|---|"
        awk -v module="$(go list -m)/" '
          NR > 1 {
            stmts[$1] = $2
            if ($3 > 0) hit[$1] = 1
          }
          END {
            for (block in stmts) {
              split(block, parts, ":")
              pkg = parts[1]
              sub(/\/[^\/]*$/, "", pkg)
              sub("^" module, "", pkg)
              total[pkg] += stmts[block]
              if (block in hit) covered[pkg] += stmts[block]
            }
            for (pkg in total) printf "| %s | %.1f%% |\n", pkg, 100 * covered[pkg] / total[pkg]
          }
        ' coverage.out | sort
        echo
        echo "Enforced total (excluding \`cmd/\` and generated code, floor in \`.testcoverage.yml\`):"
        echo
        go tool go-test-coverage --config=.testcoverage.yml 2>&1 | grep "Total test coverage" || true

  vuln:
    desc: Scan the Go dependencies for known vulnerabilities
    cmds:
      - go tool govulncheck ./...

  build:
    desc: Build bin/verve with version metadata and the web app embedded
    deps: [web:build]
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse --short HEAD
      BUILD_DATE: '{{dateInZone "2006-01-02T15:04:05Z" now "UTC"}}'
    env:
      CGO_ENABLED: "0"
    cmds:
      - >-
        go build -trimpath
        -ldflags "-s -w
        -X {{.VERSION_PKG}}.version={{.VERSION}}
        -X {{.VERSION_PKG}}.commit={{.COMMIT}}
        -X {{.VERSION_PKG}}.date={{.BUILD_DATE}}"
        -o bin/verve ./cmd/verve

  dev:
    desc: Run the Go server with live reload and the Vite dev server (http://localhost:5173)
    deps: [dev:server, dev:web]

  dev:server:
    desc: Run the Go server on 127.0.0.1:8080 and rebuild it on change
    env:
      VERVE_DATA_DIR: .dev-data
      VERVE_LISTEN_ADDR: 127.0.0.1:8080
      VERVE_LOG_LEVEL: debug
      VERVE_LOG_FORMAT: text
      VERVE_PUBLIC_URL: http://localhost:5173
    cmds:
      - go tool air

  dev:web:
    desc: Run the Vite dev server on port 5173, proxying the API to the Go server
    dir: web
    deps: [web:install]
    cmds:
      - pnpm dev

  web:install:
    desc: Install the web dependencies from the lockfile
    dir: web
    run: once
    cmds:
      - pnpm install --frozen-lockfile

  web:lint:
    desc: Run the web linters, format check and type check
    dir: web
    deps: [web:install]
    cmds:
      - pnpm lint
      - pnpm format:check
      - pnpm typecheck
      - pnpm i18n:check

  generate:
    desc: Generate code (sqlc queries, translation keys and types)
    cmds:
      - task: go:generate
      - task: web:generate

  go:generate:
    desc: Generate the Go code of the SQL queries in internal/store/sqlite/sqlcgen
    cmds:
      - go tool sqlc generate

  web:generate:
    desc: Extract translation keys into the locale files and generate their types
    dir: web
    deps: [web:install]
    cmds:
      - pnpm i18n:extract

  web:test:
    desc: Run the web tests
    dir: web
    deps: [web:install]
    cmds:
      - pnpm test

  web:build:
    desc: Build the web app into web/dist and sync it into internal/webui/dist, which the binary embeds
    deps: [web:install]
    cmds:
      - pnpm --dir web build
      # A Go program rather than rsync or cp, so that it works on every OS.
      - go run ./tools/syncdist web/dist internal/webui/dist
