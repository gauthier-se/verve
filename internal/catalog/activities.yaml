# The activity type catalog: the values of HKWorkoutActivityType that a workout can have, described
# in docs/features/data-storage-and-aggregates.md FR-4.
#
# - The activity types come from the Apple documentation of HKWorkoutActivityType, and their raw
#   values from HKWorkout.h of the iOS SDK, since the documentation does not give them. The
#   deprecated dance, dance_inspired_training and mixed_metabolic_cardio_training stay, for older
#   data.
# - identifier is the name of the activity type in the XML export.
# - key is the identifier in snake case, without the prefix HKWorkoutActivityType.
# - family is an activity family of FR-4, which deduplication compares (FR-11 of
#   docs/features/data-deduplication-and-source-priority.md). Two workouts of different sources
#   rarely overlap unless they are copies, so a family is broad: stretching, recovery and cooldown
#   are mind_and_body like yoga, and track_and_field, whose events are throws and jumps, is other.
# - Names live in web/src/locales/<language>/activities.json, keyed by the activity key.
#
# A key is what the API and the workouts store: never change the key of an activity type once
# released.

activities:
  - {key: american_football, identifier: HKWorkoutActivityTypeAmericanFootball, raw_value: 1, family: team_sport}
  - {key: archery, identifier: HKWorkoutActivityTypeArchery, raw_value: 2, family: other}
