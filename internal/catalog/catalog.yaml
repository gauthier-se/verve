    kind: category
    unit: count
    aggregation: discrete
    group: other
    values: *not_applicable
  - {<<: *other_event, key: toothbrushing_event, identifier: HKCategoryTypeIdentifierToothbrushingEvent}
  - {<<: *other_event, key: handwashing_event, identifier: HKCategoryTypeIdentifierHandwashingEvent}

