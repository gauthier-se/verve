  - {key: oxygen_saturation, identifier: HKQuantityTypeIdentifierOxygenSaturation, kind: quantity, unit: fraction, aggregation: discrete, group: respiratory}
  - {key: sleeping_breathing_disturbances, identifier: HKQuantityTypeIdentifierAppleSleepingBreathingDisturbances, kind: quantity, unit: count, aggregation: discrete, group: respiratory}
  - {key: forced_vital_capacity, identifier: HKQuantityTypeIdentifierForcedVitalCapacity, kind: quantity, unit: L, aggregation: discrete, group: respiratory}
  - {key: forced_expiratory_volume_1, identifier: HKQuantityTypeIdentifierForcedExpiratoryVolume1, kind: quantity, unit: L, aggregation: discrete, group: respiratory}
  - {key: peak_expiratory_flow_rate, identifier: HKQuantityTypeIdentifierPeakExpiratoryFlowRate, kind: quantity, unit: L/min, aggregation: discrete, group: respiratory}
  - {key: inhaler_usage, identifier: HKQuantityTypeIdentifierInhalerUsage, kind: quantity, unit: count, aggregation: cumulative, group: respiratory}
  - {<<: *event, key: sleep_apnea_event, identifier: HKCategoryTypeIdentifierSleepApneaEvent, group: respiratory}

  # Vitals
  - {key: body_temperature, identifier: HKQuantityTypeIdentifierBodyTemperature, kind: quantity, unit: degC, aggregation: discrete, group: vitals}
  - {key: blood_pressure_systolic, identifier: HKQuantityTypeIdentifierBloodPressureSystolic, kind: quantity, unit: mmHg, aggregation: discrete, group: vitals}
  - {key: blood_pressure_diastolic, identifier: HKQuantityTypeIdentifierBloodPressureDiastolic, kind: quantity, unit: mmHg, aggregation: discrete, group: vitals}
  - {key: blood_glucose, identifier: HKQuantityTypeIdentifierBloodGlucose, kind: quantity, unit: mg/dL, aggregation: discrete, group: vitals}
  - {key: peripheral_perfusion_index, identifier: HKQuantityTypeIdentifierPeripheralPerfusionIndex, kind: quantity, unit: fraction, aggregation: discrete, group: vitals}

  # Mobility
  - {key: walking_speed, identifier: HKQuantityTypeIdentifierWalkingSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: mobility}
  - {key: walking_step_length, identifier: HKQuantityTypeIdentifierWalkingStepLength, kind: quantity, unit: m, aggregation: discrete, group: mobility}
  - {key: walking_asymmetry_percentage, identifier: HKQuantityTypeIdentifierWalkingAsymmetryPercentage, kind: quantity, unit: fraction, aggregation: discrete, group: mobility}
  - {key: walking_double_support_percentage, identifier: HKQuantityTypeIdentifierWalkingDoubleSupportPercentage, kind: quantity, unit: fraction, aggregation: discrete, group: mobility}
  - {key: walking_steadiness, identifier: HKQuantityTypeIdentifierAppleWalkingSteadiness, kind: quantity, unit: fraction, aggregation: discrete, group: mobility}
  - {key: stair_ascent_speed, identifier: HKQuantityTypeIdentifierStairAscentSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: mobility}
  - {key: stair_descent_speed, identifier: HKQuantityTypeIdentifierStairDescentSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: mobility}
  - {key: six_minute_walk_test_distance, identifier: HKQuantityTypeIdentifierSixMinuteWalkTestDistance, kind: quantity, unit: m, aggregation: discrete, group: mobility}
  - key: walking_steadiness_event
    identifier: HKCategoryTypeIdentifierAppleWalkingSteadinessEvent
    kind: category
    unit: count
    aggregation: discrete
    group: mobility
    values:
      - {key: initial_low, identifier: HKCategoryValueAppleWalkingSteadinessEventInitialLow}
      - {key: initial_very_low, identifier: HKCategoryValueAppleWalkingSteadinessEventInitialVeryLow}
      - {key: repeat_low, identifier: HKCategoryValueAppleWalkingSteadinessEventRepeatLow}
      - {key: repeat_very_low, identifier: HKCategoryValueAppleWalkingSteadinessEventRepeatVeryLow}

  # Hearing
  - {key: environmental_audio_exposure, identifier: HKQuantityTypeIdentifierEnvironmentalAudioExposure, kind: quantity, unit: dBASPL, aggregation: discrete, group: hearing}
  - {key: headphone_audio_exposure, identifier: HKQuantityTypeIdentifierHeadphoneAudioExposure, kind: quantity, unit: dBASPL, aggregation: discrete, group: hearing}
  - {key: environmental_sound_reduction, identifier: HKQuantityTypeIdentifierEnvironmentalSoundReduction, kind: quantity, unit: dBASPL, aggregation: discrete, group: hearing}
  - &hearing_event
    key: environmental_audio_exposure_event
    identifier: HKCategoryTypeIdentifierEnvironmentalAudioExposureEvent
    kind: category
    unit: count
    aggregation: discrete
    group: hearing
    values:
      - {key: momentary_limit, identifier: HKCategoryValueEnvironmentalAudioExposureEventMomentaryLimit}
  - <<: *hearing_event
    key: headphone_audio_exposure_event
    identifier: HKCategoryTypeIdentifierHeadphoneAudioExposureEvent
    values:
      - {key: seven_day_limit, identifier: HKCategoryValueHeadphoneAudioExposureEventSevenDayLimit}
  # Deprecated since iOS 14 for environmental_audio_exposure_event, still in older exports.
  - <<: *hearing_event
    key: audio_exposure_event
    identifier: HKCategoryTypeIdentifierAudioExposureEvent
    values:
      - {key: loud_environment, identifier: HKCategoryValueAudioExposureEventLoudEnvironment}

  # Cycle
  - {key: basal_body_temperature, identifier: HKQuantityTypeIdentifierBasalBodyTemperature, kind: quantity, unit: degC, aggregation: discrete, group: cycle}
  # Menstrual flow takes the values of HKCategoryValueVaginalBleeding, which replaced those of
  # HKCategoryValueMenstrualFlow in iOS 18.
  - &cycle
    key: menstrual_flow
    identifier: HKCategoryTypeIdentifierMenstrualFlow
    kind: category
    unit: count
    aggregation: discrete
    group: cycle
    values: &vaginal_bleeding
      - {key: unspecified, identifier: HKCategoryValueVaginalBleedingUnspecified}
      - {key: light, identifier: HKCategoryValueVaginalBleedingLight}
      - {key: medium, identifier: HKCategoryValueVaginalBleedingMedium}
      - {key: heavy, identifier: HKCategoryValueVaginalBleedingHeavy}
      - {key: none, identifier: HKCategoryValueVaginalBleedingNone}
  - {<<: *cycle, key: intermenstrual_bleeding, identifier: HKCategoryTypeIdentifierIntermenstrualBleeding, values: *not_applicable}
  - {<<: *cycle, key: infrequent_menstrual_cycles, identifier: HKCategoryTypeIdentifierInfrequentMenstrualCycles, values: *not_applicable}
  - {<<: *cycle, key: irregular_menstrual_cycles, identifier: HKCategoryTypeIdentifierIrregularMenstrualCycles, values: *not_applicable}
  - {<<: *cycle, key: persistent_intermenstrual_bleeding, identifier: HKCategoryTypeIdentifierPersistentIntermenstrualBleeding, values: *not_applicable}
  - {<<: *cycle, key: prolonged_menstrual_periods, identifier: HKCategoryTypeIdentifierProlongedMenstrualPeriods, values: *not_applicable}
  - <<: *cycle
    key: cervical_mucus_quality
    identifier: HKCategoryTypeIdentifierCervicalMucusQuality
    values:
      - {key: dry, identifier: HKCategoryValueCervicalMucusQualityDry}
      - {key: sticky, identifier: HKCategoryValueCervicalMucusQualitySticky}
      - {key: creamy, identifier: HKCategoryValueCervicalMucusQualityCreamy}
      - {key: watery, identifier: HKCategoryValueCervicalMucusQualityWatery}
      - {key: egg_white, identifier: HKCategoryValueCervicalMucusQualityEggWhite}
  - <<: *cycle
    key: ovulation_test_result
    identifier: HKCategoryTypeIdentifierOvulationTestResult
    values:
      - {key: negative, identifier: HKCategoryValueOvulationTestResultNegative}
      - {key: luteinizing_hormone_surge, identifier: HKCategoryValueOvulationTestResultLuteinizingHormoneSurge}
      - {key: indeterminate, identifier: HKCategoryValueOvulationTestResultIndeterminate}
      - {key: estrogen_surge, identifier: HKCategoryValueOvulationTestResultEstrogenSurge}
  - <<: *cycle
    key: pregnancy_test_result
    identifier: HKCategoryTypeIdentifierPregnancyTestResult
    values:
      - {key: positive, identifier: HKCategoryValuePregnancyTestResultPositive}
      - {key: negative, identifier: HKCategoryValuePregnancyTestResultNegative}
      - {key: indeterminate, identifier: HKCategoryValuePregnancyTestResultIndeterminate}
  - <<: *cycle
    key: progesterone_test_result
    identifier: HKCategoryTypeIdentifierProgesteroneTestResult
    values:
      - {key: positive, identifier: HKCategoryValueProgesteroneTestResultPositive}
      - {key: negative, identifier: HKCategoryValueProgesteroneTestResultNegative}
      - {key: indeterminate, identifier: HKCategoryValueProgesteroneTestResultIndeterminate}
  - {<<: *cycle, key: sexual_activity, identifier: HKCategoryTypeIdentifierSexualActivity, values: *not_applicable}
  - <<: *cycle
    key: contraceptive
    identifier: HKCategoryTypeIdentifierContraceptive
    values:
      - {key: unspecified, identifier: HKCategoryValueContraceptiveUnspecified}
      - {key: implant, identifier: HKCategoryValueContraceptiveImplant}
      - {key: injection, identifier: HKCategoryValueContraceptiveInjection}
      - {key: intrauterine_device, identifier: HKCategoryValueContraceptiveIntrauterineDevice}
      - {key: intravaginal_ring, identifier: HKCategoryValueContraceptiveIntravaginalRing}
      - {key: oral, identifier: HKCategoryValueContraceptiveOral}
      - {key: patch, identifier: HKCategoryValueContraceptivePatch}
  - {<<: *cycle, key: pregnancy, identifier: HKCategoryTypeIdentifierPregnancy, values: *not_applicable}
  - {<<: *cycle, key: lactation, identifier: HKCategoryTypeIdentifierLactation, values: *not_applicable}
  - <<: *cycle
    key: menopausal_state
    identifier: HKCategoryTypeIdentifierMenopausalState
    values:
      - {key: none, identifier: HKCategoryValueMenopausalStateNone}
      - {key: perimenopause, identifier: HKCategoryValueMenopausalStatePerimenopause}
      - {key: menopause, identifier: HKCategoryValueMenopausalStateMenopause}
  - {<<: *cycle, key: bleeding_during_pregnancy, identifier: HKCategoryTypeIdentifierBleedingDuringPregnancy, values: *vaginal_bleeding}
  - {<<: *cycle, key: bleeding_after_pregnancy, identifier: HKCategoryTypeIdentifierBleedingAfterPregnancy, values: *vaginal_bleeding}
  - {<<: *cycle, key: bleeding_after_menopause, identifier: HKCategoryTypeIdentifierBleedingAfterMenopause, values: *vaginal_bleeding}

  # Symptoms
  - &symptom
    key: abdominal_cramps
    identifier: HKCategoryTypeIdentifierAbdominalCramps
    kind: category
