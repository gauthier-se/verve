  - {key: dietary_protein, identifier: HKQuantityTypeIdentifierDietaryProtein, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
  - {key: dietary_carbohydrates, identifier: HKQuantityTypeIdentifierDietaryCarbohydrates, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
  - {key: dietary_sugar, identifier: HKQuantityTypeIdentifierDietarySugar, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
