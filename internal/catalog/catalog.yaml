      - {key: mild, identifier: HKCategoryValueSeverityMild}
      - {key: moderate, identifier: HKCategoryValueSeverityModerate}
      - {key: severe, identifier: HKCategoryValueSeveritySevere}
      - {key: unspecified, identifier: HKCategoryValueSeverityUnspecified}
  - {<<: *symptom, key: acne, identifier: HKCategoryTypeIdentifierAcne}
  - {<<: *symptom, key: bladder_incontinence, identifier: HKCategoryTypeIdentifierBladderIncontinence}
  - {<<: *symptom, key: bloating, identifier: HKCategoryTypeIdentifierBloating}
  - {<<: *symptom, key: breast_pain, identifier: HKCategoryTypeIdentifierBreastPain}
  - {<<: *symptom, key: chest_tightness_or_pain, identifier: HKCategoryTypeIdentifierChestTightnessOrPain}
  - {<<: *symptom, key: chills, identifier: HKCategoryTypeIdentifierChills}
  - {<<: *symptom, key: constipation, identifier: HKCategoryTypeIdentifierConstipation}
  - {<<: *symptom, key: coughing, identifier: HKCategoryTypeIdentifierCoughing}
  - {<<: *symptom, key: diarrhea, identifier: HKCategoryTypeIdentifierDiarrhea}
  - {<<: *symptom, key: dizziness, identifier: HKCategoryTypeIdentifierDizziness}
  - {<<: *symptom, key: dry_skin, identifier: HKCategoryTypeIdentifierDrySkin}
  - {<<: *symptom, key: fainting, identifier: HKCategoryTypeIdentifierFainting}
  - {<<: *symptom, key: fatigue, identifier: HKCategoryTypeIdentifierFatigue}
  - {<<: *symptom, key: fever, identifier: HKCategoryTypeIdentifierFever}
  - {<<: *symptom, key: generalized_body_ache, identifier: HKCategoryTypeIdentifierGeneralizedBodyAche}
  - {<<: *symptom, key: hair_loss, identifier: HKCategoryTypeIdentifierHairLoss}
  - {<<: *symptom, key: headache, identifier: HKCategoryTypeIdentifierHeadache}
