# The metric type catalog: the HealthKit quantity and category types that Verve knows, described in
# docs/features/data-storage-and-aggregates.md FR-1.
#
# - The types come from the Apple documentation of HKQuantityTypeIdentifier and
#   HKCategoryTypeIdentifier, and the values of a category type from its HKCategoryValue enum.
# - unit is a canonical unit of the Units table of docs/architecture.md. A category type has the unit
#   count, since its samples are counted.
# - aggregation is the aggregation style of HealthKit: cumulative for cumulative types, discrete
#   otherwise. A category type is discrete.
# - group is a display group of FR-1.
# - Names and descriptions live in web/src/locales/<language>/metrics.json, keyed by the type key.
#
# A key is what the API and the samples store: never change the key of a type or a value once
# released.

types:
  # Activity
  - {key: step_count, identifier: HKQuantityTypeIdentifierStepCount, kind: quantity, unit: count, aggregation: cumulative, group: activity}
  - {key: distance_walking_running, identifier: HKQuantityTypeIdentifierDistanceWalkingRunning, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_cycling, identifier: HKQuantityTypeIdentifierDistanceCycling, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_wheelchair, identifier: HKQuantityTypeIdentifierDistanceWheelchair, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_swimming, identifier: HKQuantityTypeIdentifierDistanceSwimming, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_downhill_snow_sports, identifier: HKQuantityTypeIdentifierDistanceDownhillSnowSports, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_cross_country_skiing, identifier: HKQuantityTypeIdentifierDistanceCrossCountrySkiing, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_paddle_sports, identifier: HKQuantityTypeIdentifierDistancePaddleSports, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_rowing, identifier: HKQuantityTypeIdentifierDistanceRowing, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: distance_skating_sports, identifier: HKQuantityTypeIdentifierDistanceSkatingSports, kind: quantity, unit: m, aggregation: cumulative, group: activity}
  - {key: push_count, identifier: HKQuantityTypeIdentifierPushCount, kind: quantity, unit: count, aggregation: cumulative, group: activity}
  - {key: swimming_stroke_count, identifier: HKQuantityTypeIdentifierSwimmingStrokeCount, kind: quantity, unit: count, aggregation: cumulative, group: activity}
  - {key: flights_climbed, identifier: HKQuantityTypeIdentifierFlightsClimbed, kind: quantity, unit: count, aggregation: cumulative, group: activity}
  - {key: active_energy_burned, identifier: HKQuantityTypeIdentifierActiveEnergyBurned, kind: quantity, unit: kcal, aggregation: cumulative, group: activity}
  - {key: basal_energy_burned, identifier: HKQuantityTypeIdentifierBasalEnergyBurned, kind: quantity, unit: kcal, aggregation: cumulative, group: activity}
  - {key: exercise_time, identifier: HKQuantityTypeIdentifierAppleExerciseTime, kind: quantity, unit: s, aggregation: cumulative, group: activity}
  - {key: move_time, identifier: HKQuantityTypeIdentifierAppleMoveTime, kind: quantity, unit: s, aggregation: cumulative, group: activity}
  - {key: stand_time, identifier: HKQuantityTypeIdentifierAppleStandTime, kind: quantity, unit: s, aggregation: cumulative, group: activity}
  - {key: nike_fuel, identifier: HKQuantityTypeIdentifierNikeFuel, kind: quantity, unit: count, aggregation: cumulative, group: activity}
  - {key: physical_effort, identifier: HKQuantityTypeIdentifierPhysicalEffort, kind: quantity, unit: kcal/(kg.h), aggregation: discrete, group: activity}
  - {key: workout_effort_score, identifier: HKQuantityTypeIdentifierWorkoutEffortScore, kind: quantity, unit: appleEffortScore, aggregation: discrete, group: activity}
  - {key: estimated_workout_effort_score, identifier: HKQuantityTypeIdentifierEstimatedWorkoutEffortScore, kind: quantity, unit: appleEffortScore, aggregation: discrete, group: activity}
  - {key: running_speed, identifier: HKQuantityTypeIdentifierRunningSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: activity}
  - {key: running_power, identifier: HKQuantityTypeIdentifierRunningPower, kind: quantity, unit: W, aggregation: discrete, group: activity}
  - {key: running_stride_length, identifier: HKQuantityTypeIdentifierRunningStrideLength, kind: quantity, unit: m, aggregation: discrete, group: activity}
  - {key: running_vertical_oscillation, identifier: HKQuantityTypeIdentifierRunningVerticalOscillation, kind: quantity, unit: m, aggregation: discrete, group: activity}
  - {key: running_ground_contact_time, identifier: HKQuantityTypeIdentifierRunningGroundContactTime, kind: quantity, unit: ms, aggregation: discrete, group: activity}
  - {key: cycling_speed, identifier: HKQuantityTypeIdentifierCyclingSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: activity}
  - {key: cycling_power, identifier: HKQuantityTypeIdentifierCyclingPower, kind: quantity, unit: W, aggregation: discrete, group: activity}
  - {key: cycling_functional_threshold_power, identifier: HKQuantityTypeIdentifierCyclingFunctionalThresholdPower, kind: quantity, unit: W, aggregation: discrete, group: activity}
  - {key: cycling_cadence, identifier: HKQuantityTypeIdentifierCyclingCadence, kind: quantity, unit: count/min, aggregation: discrete, group: activity}
  - {key: cross_country_skiing_speed, identifier: HKQuantityTypeIdentifierCrossCountrySkiingSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: activity}
  # The Apple documentation calls this speed cumulative, unlike every other speed: a copy of the
  # text of the paddle sports distance. A speed does not add up, so it is discrete.
  - {key: paddle_sports_speed, identifier: HKQuantityTypeIdentifierPaddleSportsSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: activity}
  - {key: rowing_speed, identifier: HKQuantityTypeIdentifierRowingSpeed, kind: quantity, unit: m/s, aggregation: discrete, group: activity}
  - key: stand_hour
    identifier: HKCategoryTypeIdentifierAppleStandHour
    kind: category
    unit: count
    aggregation: discrete
    group: activity
    values:
      - {key: stood, identifier: HKCategoryValueAppleStandHourStood}
      - {key: idle, identifier: HKCategoryValueAppleStandHourIdle}

  # Heart
  - {key: heart_rate, identifier: HKQuantityTypeIdentifierHeartRate, kind: quantity, unit: count/min, aggregation: discrete, group: heart}
  - {key: resting_heart_rate, identifier: HKQuantityTypeIdentifierRestingHeartRate, kind: quantity, unit: count/min, aggregation: discrete, group: heart}
  - {key: walking_heart_rate_average, identifier: HKQuantityTypeIdentifierWalkingHeartRateAverage, kind: quantity, unit: count/min, aggregation: discrete, group: heart}
  - {key: heart_rate_variability_sdnn, identifier: HKQuantityTypeIdentifierHeartRateVariabilitySDNN, kind: quantity, unit: ms, aggregation: discrete, group: heart}
  - {key: heart_rate_variability_rmssd, identifier: HKQuantityTypeIdentifierHeartRateVariabilityRMSSD, kind: quantity, unit: ms, aggregation: discrete, group: heart}
  - {key: heart_rate_recovery_one_minute, identifier: HKQuantityTypeIdentifierHeartRateRecoveryOneMinute, kind: quantity, unit: count/min, aggregation: discrete, group: heart}
  - {key: atrial_fibrillation_burden, identifier: HKQuantityTypeIdentifierAtrialFibrillationBurden, kind: quantity, unit: fraction, aggregation: discrete, group: heart}
  - {key: vo2_max, identifier: HKQuantityTypeIdentifierVO2Max, kind: quantity, unit: mL/(kg.min), aggregation: discrete, group: heart}
  - &event
    key: high_heart_rate_event
    identifier: HKCategoryTypeIdentifierHighHeartRateEvent
    kind: category
    unit: count
    aggregation: discrete
    group: heart
    values: &not_applicable
      - {key: not_applicable, identifier: HKCategoryValueNotApplicable}
  - {<<: *event, key: low_heart_rate_event, identifier: HKCategoryTypeIdentifierLowHeartRateEvent}
  - {<<: *event, key: irregular_heart_rhythm_event, identifier: HKCategoryTypeIdentifierIrregularHeartRhythmEvent}
  - {<<: *event, key: hypertension_event, identifier: HKCategoryTypeIdentifierHypertensionEvent}
  - <<: *event
    key: low_cardio_fitness_event
    identifier: HKCategoryTypeIdentifierLowCardioFitnessEvent
    values:
      - {key: low_fitness, identifier: HKCategoryValueLowCardioFitnessEventLowFitness}

  # Body
  - {key: height, identifier: HKQuantityTypeIdentifierHeight, kind: quantity, unit: m, aggregation: discrete, group: body}
  - {key: body_mass, identifier: HKQuantityTypeIdentifierBodyMass, kind: quantity, unit: kg, aggregation: discrete, group: body}
  - {key: body_mass_index, identifier: HKQuantityTypeIdentifierBodyMassIndex, kind: quantity, unit: count, aggregation: discrete, group: body}
  - {key: lean_body_mass, identifier: HKQuantityTypeIdentifierLeanBodyMass, kind: quantity, unit: kg, aggregation: discrete, group: body}
  - {key: body_fat_percentage, identifier: HKQuantityTypeIdentifierBodyFatPercentage, kind: quantity, unit: fraction, aggregation: discrete, group: body}
  - {key: waist_circumference, identifier: HKQuantityTypeIdentifierWaistCircumference, kind: quantity, unit: m, aggregation: discrete, group: body}
  - {key: hip_circumference, identifier: HKQuantityTypeIdentifierHipCircumference, kind: quantity, unit: m, aggregation: discrete, group: body}
  - {key: sleeping_wrist_temperature, identifier: HKQuantityTypeIdentifierAppleSleepingWristTemperature, kind: quantity, unit: degC, aggregation: discrete, group: body}

  # Sleep
  - key: sleep_analysis
    identifier: HKCategoryTypeIdentifierSleepAnalysis
    kind: category
    unit: count
    aggregation: discrete
    group: sleep
    values:
      - {key: in_bed, identifier: HKCategoryValueSleepAnalysisInBed}
      - {key: awake, identifier: HKCategoryValueSleepAnalysisAwake}
      - {key: asleep_core, identifier: HKCategoryValueSleepAnalysisAsleepCore}
      - {key: asleep_deep, identifier: HKCategoryValueSleepAnalysisAsleepDeep}
      - {key: asleep_rem, identifier: HKCategoryValueSleepAnalysisAsleepREM}
      - {key: asleep_unspecified, identifier: HKCategoryValueSleepAnalysisAsleepUnspecified}

