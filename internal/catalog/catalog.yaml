  - <<: *symptom
    key: appetite_changes
    identifier: HKCategoryTypeIdentifierAppetiteChanges
    values:
      - {key: unspecified, identifier: HKCategoryValueAppetiteChangesUnspecified}
      - {key: no_change, identifier: HKCategoryValueAppetiteChangesNoChange}
      - {key: decreased, identifier: HKCategoryValueAppetiteChangesDecreased}
      - {key: increased, identifier: HKCategoryValueAppetiteChangesIncreased}
  - <<: *symptom
    key: mood_changes
    identifier: HKCategoryTypeIdentifierMoodChanges
    values: &presence
      - {key: present, identifier: HKCategoryValuePresencePresent}
      - {key: not_present, identifier: HKCategoryValuePresenceNotPresent}
  - {<<: *symptom, key: sleep_changes, identifier: HKCategoryTypeIdentifierSleepChanges, values: *presence}

