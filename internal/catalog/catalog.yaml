  - {key: dietary_vitamin_d, identifier: HKQuantityTypeIdentifierDietaryVitaminD, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
  - {key: dietary_vitamin_e, identifier: HKQuantityTypeIdentifierDietaryVitaminE, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
  - {key: dietary_vitamin_k, identifier: HKQuantityTypeIdentifierDietaryVitaminK, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
  - {key: dietary_caffeine, identifier: HKQuantityTypeIdentifierDietaryCaffeine, kind: quantity, unit: kg, aggregation: cumulative, group: nutrition}
