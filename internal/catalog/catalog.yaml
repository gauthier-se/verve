  - {key: blood_alcohol_content, identifier: HKQuantityTypeIdentifierBloodAlcoholContent, kind: quantity, unit: fraction, aggregation: discrete, group: other}
  - {key: electrodermal_activity, identifier: HKQuantityTypeIdentifierElectrodermalActivity, kind: quantity, unit: S, aggregation: discrete, group: other}
