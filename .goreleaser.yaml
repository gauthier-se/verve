# https://goreleaser.com/customization/
# The release itself and its notes come from release-please: this only attaches the artifacts.
version: 2

project_name: verve

before:
  hooks:
    - go tool task web:build

builds:
  - main: ./cmd/verve
    binary: verve
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/gauthier-se/verve/internal/version.version={{.Version}}
      - -X github.com/gauthier-se/verve/internal/version.commit={{.ShortCommit}}
      - -X github.com/gauthier-se/verve/internal/version.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  mode: append

changelog:
  disable: true
