name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test with coverage floor
        run: go tool task test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: |
          {
            echo "## Go coverage"
            echo
            go tool task --silent test:coverage-summary
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability scan
        run: go tool task vuln

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version of the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Translation check
        run: pnpm i18n:check

      - name: Translation status
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          {
            echo "## Translation status"
            echo
            echo '```text'
            # status exits 1 when translations are missing: keep the report.
            pnpm --silent i18n:status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test with coverage
        run: pnpm coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('web/coverage/coverage-summary.txt') != '' }}
        run: |
          {
            echo "## Web coverage"
            echo
            echo '```text'
            sed '/^$/d' coverage/coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build

  generated:
    name: generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs the pnpm version of the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Every generator: sqlc queries, OpenAPI spec, API client and translation files. git status
      # also catches generated files that are new and untracked, which git diff misses.
      - name: Generated code up to date
        run: |
          go tool task generate
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is out of date: run task generate and commit the result"
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs the pnpm version of the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        run: go tool task build

      # WebKit builds are specific to an Ubuntu release, which runner.os does
      # not tell apart, and the cached directory name does not depend on it.
      - name: Read the Playwright and Ubuntu versions
        id: versions
        working-directory: web
        run: |
          echo "playwright=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "ubuntu=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.versions.outputs.playwright }}-ubuntu-${{ steps.versions.outputs.ubuntu }}

      # Browsers restored from the cache are not downloaded again, but the
      # system packages they need are not cached and are always installed.
      - name: Install the Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Test
        working-directory: web
        run: pnpm exec playwright test

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
