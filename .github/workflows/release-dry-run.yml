name: Release dry run

# Separate from CI so that the paths filter needs no extra action. The release pull request changes
# the manifest, so it runs this too.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - release-please-config.json
      - .release-please-manifest.json
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml

permissions:
  contents: read

jobs:
  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs the pnpm version of the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check the configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # --snapshot publishes nothing but still signs, which needs an identity pull requests lack.
      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
