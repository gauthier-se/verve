<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Verve</title>
    <!-- Applies the stored Appearance (Mode + Palette, ADR 0024) before first paint,
         so a reload never flashes the wrong one. Deliberately duplicates the few
         lines of appearance.tsx that must run ahead of the bundle; the provider owns
         everything after. -->
    <script>
      (function () {
        var mode = "system";
        var palette = "verve";
        try {
          var stored = localStorage.getItem("verve-mode") || localStorage.getItem("verve-theme");
          if (stored === "light" || stored === "dark" || stored === "system") mode = stored;
          palette = localStorage.getItem("verve-palette") || palette;
        } catch (e) {
          /* Unavailable storage keeps the defaults. */
        }
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-palette", palette);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
