version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
  settings:
    sloglint:
      # Attributes only (slog.String("key", v)), never alternating key-value arguments.
      attr-only: true
      # Loggers are passed explicitly or taken from the request context, never the slog default.
      no-global: all
    depguard:
      rules:
        # Only the SQLite implementation and the wiring in internal/app see the SQLite driver.
        sqlite-driver:
          files:
            - $all
            - "!**/internal/store/sqlite/**"
            - "!**/internal/app/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: only internal/store/sqlite may use the SQLite driver
        # Domain code accesses data only through the interfaces of internal/store. Tests may open
        # the SQLite store, because database tests use a real file and never a mock.
        sqlite-store:
          files:
            - $all
            - "!$test"
            - "!**/internal/store/sqlite/**"
            - "!**/internal/app/**"
          deny:
            - pkg: github.com/gauthier-se/verve/internal/store/sqlite
              desc: depend on the internal/store interfaces; only internal/app wires the SQLite implementation

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gauthier-se/verve
