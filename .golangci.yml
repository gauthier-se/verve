version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        # Domain code accesses data only through the interfaces of internal/store. Only the SQLite
        # implementation and the wiring in internal/app see SQLite.
        sqlite:
          files:
            - $all
            - "!**/internal/store/sqlite/**"
            - "!**/internal/app/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: only internal/store/sqlite may use the SQLite driver
            - pkg: github.com/gauthier-se/verve/internal/store/sqlite
              desc: depend on the internal/store interfaces; only internal/app wires the SQLite implementation

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gauthier-se/verve
